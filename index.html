<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Мои ссылки</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <img class="corner-gif" src="res/1.gif" alt="">
  <main class="page">
    <header><h1>Мои ссылки</h1><p>Простое место для важных ссылок</p></header>
    <section class="add-panel">
      <form id="linkForm" class="link-form">
        <input id="title" required placeholder="Название ссылки">
        <input id="url" required placeholder="Ссылка: google.com или https://google.com">
        <select id="group"><option value="">Без группы</option></select>
        <button type="submit">Добавить ссылку</button>
      </form>
      <form id="groupForm" class="group-form"><input id="groupName" required placeholder="Новая группа, например Работа"><button type="submit">Создать группу</button></form>
    </section>
    <section id="groups" class="groups"></section>
    <p id="empty" class="empty">Ссылок ещё нет. Добавьте первую выше.</p>
  </main>
  <template id="groupTemplate"><section class="group"><div class="group-head"><h2></h2><span class="count"></span></div><div class="links"></div></section></template>
  <script src="app.js"></script>
</body>
</html>
